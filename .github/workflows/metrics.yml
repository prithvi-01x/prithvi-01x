name: GitHub Metrics

on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          user: prithvi-01x
          token: ${{ secrets.METRICS_TOKEN }}

          template: classic
          base: header, community, metadata
          config_timezone: Asia/Kolkata
          config_display: large
          config_padding: 0, 8

          # Languages
          plugin_languages: yes
          plugin_languages_limit: 6

          # Repositories
          plugin_repositories: yes
          plugin_repositories_featured: nullvex, XenoraSec, Netwatch, crypto-tracer
          plugin_repositories_pinned: 3

          # Stars
          plugin_stars: yes

          # Calendar
          plugin_isocalendar: yes
